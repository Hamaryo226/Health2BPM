name: Health2BPM
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: "1"
targets:
  Health2BPM:
    type: application
    platform: iOS
    sources:
      - path: iOS
      - path: Shared
    info:
      path: iOS/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: Spotify Callback
            CFBundleURLSchemes:
              - health2bpm
        UILaunchScreen: {}
    entitlements:
      path: iOS/Health2BPM.entitlements
    settings:
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: A9K5YN93F2
      PRODUCT_BUNDLE_IDENTIFIER: com.example.health2bpm
      INFOPLIST_KEY_CFBundleDisplayName: Health2BPM
    dependencies:
      - target: Health2BPMWatch Watch App
        embed: true
  Health2BPMWatch Watch App:
    type: application
    platform: watchOS
    sources:
      - path: Watch
      - path: Shared
    info:
      path: Watch/Info.plist
      properties:
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.example.health2bpm
        NSHealthShareUsageDescription: 心拍数を読み取り、BPMに近いSpotify楽曲を提案するために使用します。
    entitlements:
      path: Watch/Health2BPMWatch.entitlements
    settings:
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: A9K5YN93F2
      PRODUCT_BUNDLE_IDENTIFIER: com.example.health2bpm.watchkitapp
      INFOPLIST_KEY_CFBundleDisplayName: Health2BPM
